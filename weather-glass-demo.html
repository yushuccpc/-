<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琉璃气象站 · 每日签到</title>
<style>
  :root{
    --accent:#7dd3fc;
    --ink:#f8fafc;
    --ink-dim:rgba(226,232,240,.72);
    --glass:rgba(255,255,255,.10);
    --glass-strong:rgba(255,255,255,.14);
    --stroke:rgba(255,255,255,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#0b1220 0%,#17233d 60%,#101a30 100%);
    overflow-x:hidden;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:28px 16px;
  }

  /* ---------- 背景光斑 ---------- */
  .bg{position:fixed;inset:0;overflow:hidden;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen}
  .b1{width:46vmax;height:46vmax;background:#0ea5e9;top:-12%;left:-10%;animation:drift1 26s ease-in-out infinite alternate}
  .b2{width:38vmax;height:38vmax;background:#8b5cf6;bottom:-14%;right:-8%;animation:drift2 32s ease-in-out infinite alternate}
  .b3{width:26vmax;height:26vmax;background:#f472b6;top:38%;left:58%;animation:drift3 24s ease-in-out infinite alternate}
  .b4{width:20vmax;height:20vmax;background:#fbbf24;bottom:6%;left:12%;opacity:.35;animation:drift1 38s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(9vw,7vh) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-8vw,-6vh) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-10vw,8vh) scale(.9)}}

  /* ---------- 天气特效层 ---------- */
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none}
  .fx-glow{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.2s}
  .fx-glow.sunny{opacity:1;background:radial-gradient(60% 45% at 72% 12%,rgba(251,191,36,.28),transparent 70%)}
  .fx-glow.foggy{opacity:1;background:linear-gradient(180deg,rgba(203,213,225,.10),rgba(203,213,225,.02) 45%,rgba(203,213,225,.12))}
  .fx-flash{position:fixed;inset:0;z-index:1;pointer-events:none;background:#e0f2fe;opacity:0}
  .fx-flash.stormy{animation:flash 4.5s infinite}
  @keyframes flash{0%,92%,96%,100%{opacity:0}93%,95%{opacity:.22}}

  /* ---------- 玻璃材质 ---------- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--stroke);
    box-shadow:0 8px 32px rgba(2,6,23,.37),inset 0 1px 0 rgba(255,255,255,.22);
  }

  main{position:relative;z-index:2;width:100%;max-width:430px;display:flex;flex-direction:column;gap:16px}

  /* ---------- 顶栏 ---------- */
  .bar{display:flex;justify-content:space-between;align-items:center;animation:fadeUp .6s ease both}
  .pill{border-radius:999px;padding:9px 16px;font-size:13.5px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .pill b{font-size:15px;color:var(--accent)}

  /* ---------- 图标（Lucide） ---------- */
  .ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-.125em}
  .pill .ico{width:15px;height:15px;color:var(--accent)}
  .pill .ico.flame{color:#fb923c}
  .btn .ico{width:17px;height:17px;stroke-width:2.2;vertical-align:-3px;margin-right:3px}
  .landmark .ico{width:13px;height:13px;color:var(--accent);vertical-align:-2px;margin-right:2px}
  .reroll .ico{width:13px;height:13px;vertical-align:-2px;margin-left:3px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- 主卡片 ---------- */
  .card{border-radius:26px;overflow:hidden;position:relative;animation:fadeUp .6s .08s ease both;min-height:480px;display:flex;flex-direction:column}

  /* ① 待签到 */
  #idleView{padding:44px 30px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;justify-content:center}
  .date{font-size:13px;color:var(--ink-dim);letter-spacing:.12em}
  h1{font-size:27px;line-height:1.5;font-weight:700;letter-spacing:.02em}
  .sub{font-size:14px;color:var(--ink-dim)}
  .globe{margin:10px 0 4px;animation:bob 3.2s ease-in-out infinite;color:#7dd3fc;filter:drop-shadow(0 8px 18px rgba(125,211,252,.35))}
  .globe .ico{width:64px;height:64px;stroke-width:1.1;vertical-align:0}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .btn{
    margin-top:10px;border-radius:999px;padding:14px 34px;font-size:16px;font-weight:600;color:#0b1220;
    background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(224,242,254,.85));
    border:1px solid rgba(255,255,255,.7);cursor:pointer;letter-spacing:.06em;
    box-shadow:0 10px 28px rgba(125,211,252,.30),inset 0 1px 0 #fff;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(125,211,252,.42),inset 0 1px 0 #fff}
  .btn:active{transform:translateY(0) scale(.97)}

  /* ② 抽取中 */
  #drawView{padding:54px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;flex:1;justify-content:center}
  .slot{font-size:40px;font-weight:800;letter-spacing:.04em;height:58px;display:flex;align-items:center;gap:14px}
  .slot .slot-globe{width:34px;height:34px;stroke-width:1.5;color:var(--accent);vertical-align:0}
  .slot.blur span{animation:slotBlur .16s linear infinite}
  .slot.blur .slot-globe{animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes slotBlur{0%,100%{filter:blur(0)}50%{filter:blur(2.5px)}}
  .slotbar{width:210px;height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .slotbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7dd3fc,#a78bfa,#f472b6)}

  /* ③ 结果 */
  #resultView{display:flex;flex-direction:column;animation:fadeUp .5s ease both}
  .hero{position:relative;height:212px;overflow:hidden;background:linear-gradient(120deg,#1e293b,#334155)}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 1s ease,filter 1s ease;filter:blur(10px)}
  .hero img.loaded{opacity:1;filter:blur(0)}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.05) 30%,rgba(11,18,32,.78))}
  .hero figcaption{position:absolute;left:20px;right:20px;bottom:14px;z-index:2}
  .cityline{display:flex;align-items:center;gap:10px}
  .cityline h2{font-size:25px;letter-spacing:.03em;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .tag{border-radius:999px;padding:3px 11px;font-size:12px;background:rgba(255,255,255,.16)}
  .landmark{margin-top:5px;font-size:13px;color:rgba(241,245,249,.9);text-shadow:0 1px 8px rgba(0,0,0,.45)}
  .stamp{
    position:absolute;top:16px;right:16px;z-index:3;
    border:2.5px solid rgba(255,255,255,.9);color:#fff;border-radius:10px;
    padding:5px 12px;font-size:14px;font-weight:800;letter-spacing:.2em;text-indent:.2em;
    transform:rotate(-12deg);text-shadow:0 1px 6px rgba(0,0,0,.3);
    box-shadow:0 4px 16px rgba(0,0,0,.25),inset 0 0 12px rgba(255,255,255,.18);
    background:rgba(244,63,94,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .stamp.pop{animation:stampIn .5s .45s cubic-bezier(.2,2.2,.4,.9) both}
  @keyframes stampIn{from{opacity:0;transform:rotate(-12deg) scale(1.7)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
  .wline{display:flex;align-items:center;gap:16px;padding:20px 24px 6px}
  .wicon{display:flex;align-items:center;justify-content:center;color:var(--accent);filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
  .wicon .ico{width:44px;height:44px;stroke-width:1.6;vertical-align:0}
  .wline b{font-size:40px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
  .wline .wlabel{margin-left:10px;font-size:15px;color:var(--ink-dim)}
  .grid{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:14px 18px 4px}
  .grid li{border-radius:15px;padding:11px 4px;text-align:center;display:flex;flex-direction:column;gap:4px}
  .grid span{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--ink-dim)}
  .grid .ico{width:13px;height:13px;color:var(--accent);opacity:.9;vertical-align:0}
  .grid b{font-size:14.5px;font-weight:700}
  .bless{padding:14px 24px 4px;font-size:13.5px;color:var(--ink-dim);text-align:center;line-height:1.7}
  .bless em{color:var(--accent);font-style:normal}
  .reroll{
    align-self:center;margin:12px 0 18px;background:none;border:none;cursor:pointer;
    color:rgba(148,163,184,.85);font-size:12.5px;letter-spacing:.05em;text-decoration:underline dotted;
  }
  .reroll:hover{color:#e2e8f0}

  /* ---------- 本周签到条 ---------- */
  .week{border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;animation:fadeUp .6s .16s ease both}
  .week .wt{font-size:12.5px;color:var(--ink-dim);letter-spacing:.08em}
  .days{display:flex;gap:8px}
  .day{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:rgba(148,163,184,.9)}
  .day.on{background:linear-gradient(135deg,rgba(125,211,252,.5),rgba(167,139,250,.5));color:#fff;border-color:rgba(255,255,255,.4);
    box-shadow:0 3px 10px rgba(125,211,252,.3)}
  .day.today{outline:1.5px dashed rgba(255,255,255,.45);outline-offset:2px}

  @media (max-width:380px){
    .grid{grid-template-columns:repeat(2,1fr)}
    h1{font-size:23px}
  }
</style>
</head>

<div class="bg">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
</div>

<div class="fx-glow" id="fxGlow"></div>
<div class="fx-flash" id="fxFlash"></div>

<main>
  <header class="bar">
    <div class="pill glass"><svg class="ico"><use href="#i-cloud-sun"/></svg>琉璃气象站</div>
    <div class="pill glass"><svg class="ico flame"><use href="#i-flame"/></svg>连续签到 <b id="streakNum">0</b> 天</div>
  </header>

  <section class="card glass" id="card">
    <!-- ① 待签到 -->
    <div id="idleView">
      <p class="date" id="todayStr"></p>
      <h1>今日份的远方<br>正在等待抽取</h1>
      <p class="sub">每日签到 · 随机遇见一座城市的天气</p>
      <div class="globe"><svg class="ico"><use href="#i-globe"/></svg></div>
      <button class="btn" id="drawBtn"><svg class="ico"><use href="#i-sparkles"/></svg>开始今日签到</button>
    </div>

    <!-- ② 抽取中 -->
    <div id="drawView" hidden>
      <p class="sub">正在为你抽取目的地…</p>
      <div class="slot blur"><svg class="ico slot-globe"><use href="#i-globe"/></svg><span id="slotCity">巴黎</span></div>
      <div class="slotbar"><i id="slotBar"></i></div>
    </div>

    <!-- ③ 结果 -->
    <div id="resultView" hidden>
      <figure class="hero">
        <img id="heroImg" alt="地标风景">
        <div class="stamp" id="stamp">已签到</div>
        <figcaption>
          <div class="cityline"><h2 id="cityName"></h2><span class="tag glass" id="country"></span></div>
          <p class="landmark"><svg class="ico"><use href="#i-map-pin"/></svg><span id="landmark"></span></p>
        </figcaption>
      </figure>
      <div class="wline">
        <span class="wicon" id="wIcon"></span>
        <div><b id="wTemp">26°</b><span class="wlabel" id="wLabel">晴朗</span></div>
      </div>
      <ul class="grid">
        <li class="glass"><span><svg class="ico"><use href="#i-droplets"/></svg>湿度</span><b id="wHum">--</b></li>
        <li class="glass"><span><svg class="ico"><use href="#i-wind"/></svg>风速</span><b id="wWind">--</b></li>
        <li class="glass"><span><svg class="ico"><use href="#i-thermometer"/></svg>体感</span><b id="wFeel">--</b></li>
        <li class="glass"><span><svg class="ico"><use href="#i-leaf"/></svg>空气</span><b id="wAqi">--</b></li>
      </ul>
      <p class="bless" id="bless"></p>
      <button class="reroll" id="reroll">演示模式 · 再抽一次<svg class="ico"><use href="#i-rotate-ccw"/></svg></button>
    </div>
  </section>

  <section class="week glass">
    <span class="wt">本周签到</span>
    <div class="days" id="days"></div>

</main>

  { key:'fog',    label:'薄雾',   icon:'i-cloud-fog',       t:[6,16],  hum:[75,95], wind:[2,8],   accent:'#cbd5e1', bless:'雾里的城市，藏着温柔的轮廓。' },
];

const AQIS = ['优','优','良','良','轻度污染'];

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const ico = id => `<svg class="ico"><use href="#${id}"/></svg>`;
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const todayKey = () => new Date().toISOString().slice(0,10);
const store = {
  get today(){ try{return JSON.parse(localStorage.getItem('checkin:'+todayKey()))}catch(e){return null} },
  set today(v){ localStorage.setItem('checkin:'+todayKey(), JSON.stringify(v)) },
  get history(){ try{return JSON.parse(localStorage.getItem('checkinHistory')||'[]')}catch(e){return []} },
  pushHistory(d){ const h=this.history; if(!h.includes(d)){h.push(d);localStorage.setItem('checkinHistory',JSON.stringify(h))} },
};

/* ================= 签到状态 ================= */
function genRecord(){
  const ci = rnd(0, CITIES.length-1);
  const w  = pick(WEATHERS);
  return {
    date: todayKey(), cityIndex: ci, weatherKey: w.key,
    temp: rnd(w.t[0], w.t[1]),
    humidity: rnd(w.hum[0], w.hum[1]),
    wind: rnd(w.wind[0], w.wind[1]),
    aqi: pick(AQIS),
  };
}

function calcStreak(){
  const h = store.history;
  let streak = 0;
  const d = new Date();
  if(!h.includes(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1); // 今天未签则从昨天算
  while(h.includes(d.toISOString().slice(0,10))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function renderWeek(){
  const h = store.history;
  const box = $('days'); box.innerHTML = '';
  const labels = ['一','二','三','四','五','六','日'];
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const key = d.toISOString().slice(0,10);
    const el = document.createElement('div');
    el.className = 'day' + (h.includes(key) ? ' on' : '') + (key===todayKey() ? ' today' : '');
    el.textContent = labels[i];
    el.title = key;
    box.appendChild(el);
  }
}

/* ================= 天气特效 ================= */
const fxCanvas = $('fx'), fctx = fxCanvas.getContext('2d');
let fxParticles = [], fxMode = null, fxRaf = null;
function fxResize(){ fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; }
addEventListener('resize', fxResize); fxResize();

function fxStart(mode){
  fxStop(); fxMode = mode;
  $('fxGlow').className = 'fx-glow' + (mode==='sunny'||mode==='partly' ? ' sunny' : mode==='fog' ? ' foggy' : '');
  $('fxFlash').className = 'fx-flash' + (mode==='storm' ? ' stormy' : '');
  const n = mode==='rain'||mode==='storm' ? 130 : mode==='snow' ? 90 : 0;
  if(!n) return;
  for(let i=0;i<n;i++){
    fxParticles.push({
      x: Math.random()*fxCanvas.width,
      y: Math.random()*fxCanvas.height,
      l: mode==='snow' ? rnd(2,4) : rnd(10,22),          // 半径或雨丝长度
      vy: mode==='snow' ? Math.random()*1.2+.6 : Math.random()*6+9,
      vx: mode==='snow' ? Math.random()*.8-.4 : -1.5,
      o: Math.random()*.4+.25,
    });
  }
  (function loop(){
    fctx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
    if(fxMode==='rain'||fxMode==='storm'){
      fctx.strokeStyle='rgba(174,214,255,.55)'; fctx.lineWidth=1.1; fctx.beginPath();
      fxParticles.forEach(p=>{
        fctx.globalAlpha=p.o;
        fctx.moveTo(p.x,p.y); fctx.lineTo(p.x+p.vx, p.y+p.l);
        p.x+=p.vx; p.y+=p.vy;
        if(p.y>fxCanvas.height){p.y=-p.l;p.x=Math.random()*fxCanvas.width}
      });
      fctx.stroke();
    }else if(fxMode==='snow'){
      fxParticles.forEach(p=>{
        fctx.globalAlpha=p.o; fctx.fillStyle='#f1f5f9'; fctx.beginPath();
        fctx.arc(p.x,p.y,p.l,0,7); fctx.fill();
        p.x+=p.vx+Math.sin(p.y*.01)*.3; p.y+=p.vy;
        if(p.y>fxCanvas.height){p.y=-6;p.x=Math.random()*fxCanvas.width}
        if(p.x>fxCanvas.width)p.x=0; if(p.x<0)p.x=fxCanvas.width;
      });
    }
    fctx.globalAlpha=1;
    fxRaf = requestAnimationFrame(loop);
  })();
}
function fxStop(){
  if(fxRaf) cancelAnimationFrame(fxRaf);
  fctx && fctx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  fxParticles = []; fxMode = null;
}

/* ================= 渲染 ================= */
function showView(name){
  ['idleView','drawView','resultView'].forEach(v => $(v).hidden = v !== name);
}

function renderResult(rec, animate){
  const city = CITIES[rec.cityIndex];
  const w = WEATHERS.find(x => x.key === rec.weatherKey);
  document.documentElement.style.setProperty('--accent', w.accent);

  $('cityName').textContent = city.name;
  $('country').textContent  = city.country;
  $('landmark').textContent = city.landmark;
  $('wIcon').innerHTML     = ico(w.icon);
  $('wTemp').textContent    = rec.temp + '°';
  $('wLabel').textContent   = w.label;
  $('wHum').textContent     = rec.humidity + '%';
  $('wWind').textContent    = rec.wind + ' km/h';
  $('wFeel').textContent    = (rec.temp + (w.key==='sunny'?2:w.key==='snow'?-3:0)) + '°';
  $('wAqi').textContent     = rec.aqi;
  $('bless').innerHTML      = `<em>${city.name}</em> · ${w.label} · ${w.bless}`;

  const img = $('heroImg');
  img.classList.remove('loaded');
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => img.classList.add('loaded'); // 失败时保留渐变底
  img.src = city.img;

  const stamp = $('stamp');
  stamp.classList.remove('pop'); void stamp.offsetWidth;
  if(animate) stamp.classList.add('pop');

  showView('resultView');
  fxStart(w.key);
}

/* ================= 抽取动画 ================= */
let drawing = false;
function draw(){
  if(drawing) return; drawing = true;
  showView('drawView'); fxStop();
  const slot = document.querySelector('.slot');
  const DURATION = 1700, start = performance.now();
  const timer = setInterval(() => {
    const c = pick(CITIES);
    $('slotCity').textContent = `${c.name} · ${c.country}`;
  }, 80);
  (function bar(){
    const p = Math.min(1, (performance.now()-start)/DURATION);
    $('slotBar').style.width = (p*100) + '%';
    if(p < 1) requestAnimationFrame(bar);
  })();
  setTimeout(() => {
    clearInterval(timer);
    slot.classList.remove('blur');
    const rec = genRecord();
    store.today = rec; store.pushHistory(rec.date);
    renderWeek(); $('streakNum').textContent = calcStreak();
    renderResult(rec, true);
    drawing = false;
    setTimeout(() => slot.classList.add('blur'), 600);
  }, DURATION);
}

/* ================= 初始化 ================= */
(function init(){
  const d = new Date();
  $('todayStr').textContent = `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${'日一二三四五六'[d.getDay()]}`;
  $('streakNum').textContent = calcStreak();
  renderWeek();

  const rec = store.today;
  if(rec){ renderResult(rec, false); }  // 今日已签到，直接展示
  else { showView('idleView'); }

  $('drawBtn').addEventListener('click', draw);
  $('reroll').addEventListener('click', draw); // 演示模式：允许重复抽取
})();
</script>
</body>
</html>
